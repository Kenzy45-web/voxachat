<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxa Server | Join Waitlist</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #0b0d17;
            background-image: url('bg-logo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(11, 13, 23, 0.95) 0%, rgba(11, 13, 23, 0.8) 100%);
            backdrop-filter: blur(8px);
            z-index: 1;
        }

        .waitlist-container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 229, 255, 0.1);
            width: 90%;
            max-width: 600px;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--primary-color);
            font-size: 36px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .description {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 229, 255, 0.3);
            padding: 15px;
            border-radius: 12px;
            min-width: 80px;
        }

        .time-box .number {
            font-size: 32px;
            font-weight: 800;
            color: white;
            display: block;
        }

        .time-box .label {
            font-size: 12px;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .waitlist-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .waitlist-form input {
            padding: 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .waitlist-form input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .btn-large {
            display: inline-block;
            padding: 18px 40px;
            border-radius: 12px;
            background: var(--primary-color);
            color: var(--bg-color);
            font-weight: 800;
            font-size: 18px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .btn-large:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.5);
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: white;
            text-shadow: 0 0 8px var(--primary-color);
        }

        @media (max-width: 600px) {
            h1 { font-size: 28px; }
            .description { font-size: 14px; }
            .waitlist-container { padding: 40px 25px; }
            .countdown { gap: 10px; flex-wrap: wrap; }
            .time-box { min-width: 70px; padding: 10px; flex: 1 1 calc(50% - 10px); }
            .time-box .number { font-size: 24px; }
        }

        @media (max-width: 400px) {
            .time-box { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="waitlist-container">
        <h1>Join the Family</h1>
        <p class="description">
            Grab your spot in the Voxa community today. Be the first to meet new people and start your global gaming journey.
        </p>

        <div class="countdown" id="countdown">
            <div class="time-box"><span class="number" id="days">00</span><span class="label">Days</span></div>
            <div class="time-box"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
            <div class="time-box"><span class="number" id="minutes">00</span><span class="label">Mins</span></div>
            <div class="time-box"><span class="number" id="seconds">00</span><span class="label">Secs</span></div>
        </div>

        <form class="waitlist-form" id="waitlistForm">
            <input type="email" id="waitlistEmail" placeholder="Enter your email address" required>
            <button type="submit" id="waitlistBtn" class="btn-large">Join the Global Family</button>
        </form>

        <a href="index.html" class="back-link">← Return Home</a>
    </div>

    <script src="waitlist.js"></script>
</body>
</html>
