<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxa Server | Recover Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="cyber-grid"></div>

    <div class="auth-container">
        <div class="logo-container">
            <div class="logo-text">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom; margin-right: 8px; color: var(--primary-color);">
                    <rect x="2" y="6" width="20" height="12" rx="2" ry="2"></rect>
                    <path d="M6 12h4"></path>
                    <path d="M8 10v4"></path>
                    <circle cx="15" cy="13" r="1"></circle>
                    <circle cx="18" cy="11" r="1"></circle>
                </svg>
                Voxa Server
            </div>
            <div class="subtitle">Access Recovery Protocol</div>
        </div>

        <form id="forgotForm">
            <div class="input-group">
                <input type="email" id="email" required placeholder=" ">
                <label for="email">Network ID (Email)</label>
            </div>
            
            <button type="submit" class="btn btn-primary" id="forgotBtn">
                SEND RECOVERY CODE
            </button>
        </form>

        <div class="footer-links">
            <p>Remembered your code? <a href="login.html">Return to Login</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
