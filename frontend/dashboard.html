<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxa | Command Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00e5ff;
            --bg: #05060a;
            --surface: #0d0f17;
            --border: rgba(255, 255, 255, 0.08);
            --text-dim: #71768a;
        }

        * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; -webkit-tap-highlight-color: transparent; }
        *::-webkit-scrollbar { display: none; }

        body {
            margin: 0; padding: 0; background: var(--bg);
            font-family: 'Inter', sans-serif; color: white;
            min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column;
        }

        /* Subtle scanline effect */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 100;
        }

        .container {
            width: 100%; max-width: 480px; margin: 0 auto; padding: 40px 20px;
            position: relative; z-index: 10;
        }

        header {
            display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 50px;
            padding-bottom: 20px; border-bottom: 1px solid var(--border);
        }

        .voxa-title { font-size: 24px; font-weight: 800; letter-spacing: 6px; text-transform: uppercase; color: #fff; }
        .system-status { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--primary); letter-spacing: 2px; }

        .section-label {
            font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase;
            color: var(--text-dim); margin-bottom: 15px; letter-spacing: 3px; display: flex; align-items: center; gap: 10px;
        }
        .section-label::after { content: ''; height: 1px; flex-grow: 1; background: var(--border); }

        /* HORIZONTAL PRECISION CARDS */
        .console-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            padding: 25px; margin-bottom: 15px; display: flex; align-items: center; gap: 20px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; position: relative; overflow: hidden;
        }

        .console-card:hover { border-color: var(--primary); background: #121520; transform: translateX(5px); }
        .console-card:active { transform: scale(0.98); }

        .card-accent { position: absolute; left: 0; top: 0; width: 4px; height: 100%; background: var(--border); transition: 0.3s; }
        .console-card:hover .card-accent { background: var(--primary); box-shadow: 0 0 15px var(--primary); }

        .icon-box {
            width: 45px; height: 45px; background: rgba(255,255,255,0.03); border-radius: 8px;
            display: flex; justify-content: center; align-items: center; color: var(--text-dim); transition: 0.3s;
        }
        .console-card:hover .icon-box { color: var(--primary); background: rgba(0, 229, 255, 0.05); }

        .card-info { flex-grow: 1; }
        .card-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
        .card-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); text-transform: uppercase; }

        .status-badge {
            font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
            padding: 4px 10px; border-radius: 4px; border: 1px solid transparent;
        }
        .status-badge.online { color: #00ff88; background: rgba(0,255,136,0.05); border-color: rgba(0,255,136,0.1); }
        .status-badge.standby { color: #ffa500; background: rgba(255,165,0,0.05); border-color: rgba(255,165,0,0.1); }

        /* PROFILE CARD SPECIAL */
        .profile-strip {
            background: linear-gradient(90deg, var(--surface) 0%, transparent 100%);
            border-left: 4px solid var(--primary); border-radius: 0 12px 12px 0;
            padding: 20px; display: flex; align-items: center; gap: 15px; margin-top: 40px;
        }
        .mini-avatar {
            width: 50px; height: 50px; border-radius: 10px; background: var(--surface);
            border: 1px solid var(--border); overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-text h3 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: 1px; }
        .profile-text p { margin: 2px 0 0 0; font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

        /* Modals & Locks (Keeping existing logic but styling cleaner) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5,6,10,0.95); backdrop-filter: blur(20px); z-index: 1000;
            display: none; justify-content: center; align-items: center; opacity: 0; transition: 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
            width: 90%; max-width: 400px; padding: 35px; text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="voxa-title">VOXA.OS</div>
            <div class="system-status">SYS_READY // V2.0</div>
        </header>

        <div class="section-label">Server Clusters</div>
        
        <div class="console-card" onclick="window.location.href='server-dashboard.html'">
            <div class="card-accent" style="background: #00ff88;"></div>
            <div class="icon-box">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
            </div>
            <div class="card-info">
                <div class="card-title">Open Server</div>
                <div class="card-meta">Uptime: 100% // Load: Stable</div>
            </div>
            <div class="status-badge online">ONLINE</div>
        </div>

        <div class="console-card" onclick="openModal('offlineModal')">
            <div class="card-accent" style="background: #ffa500;"></div>
            <div class="icon-box">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <div class="card-info">
                <div class="card-title">Offline Nodes</div>
                <div class="card-meta">Maintenance Required</div>
            </div>
            <div class="status-badge standby">STANDBY</div>
        </div>

        <div class="section-label">Operator</div>

        <div class="profile-strip" onclick="window.location.href='profile.html'" style="cursor: pointer;">
            <div class="mini-avatar" id="userAvatar">V</div>
            <div class="profile-text">
                <h3 id="userName">...</h3>
                <p id="userRank">RANK #...</p>
            </div>
            <div style="margin-left: auto; color: var(--text-dim);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="offlineModal" class="modal-overlay" onclick="closeModal(event, 'offlineModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 style="font-size: 18px; letter-spacing: 2px;">OFFLINE NODES</h2>
            <div style="color: var(--text-dim); font-size: 12px; margin: 20px 0;">Maintenance protocol initiated. Check back for server deployment updates.</div>
            <button class="status-badge standby" style="width: 100%; padding: 15px; cursor: pointer;" onclick="closeModal(null, 'offlineModal')">ACKNOWLEDGE</button>
        </div>
    </div>

    <!-- Security Lock -->
    <div id="securityLock" class="modal-overlay" style="z-index: 9999;">
        <div class="modal-content" style="border-color: #ff3366;">
            <h1 style="font-size: 18px; letter-spacing: 4px; color: #ff3366;">LOCKED</h1>
            <p style="color: var(--text-dim); font-size: 12px; margin: 20px 0;">Verification Required.</p>
            <button id="unlockBtn" style="background: var(--primary); border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: 800; cursor: pointer;">UNBOLT SYSTEM</button>
        </div>
    </div>

    <script>
        const userData = JSON.parse(localStorage.getItem('voxa_user'));
        if (userData) {
            document.getElementById('userName').innerText = userData.username;
            document.getElementById('userRank').innerText = `RANK #${userData.rank}`;
            const avatarEl = document.getElementById('userAvatar');
            if (userData.avatar) {
                avatarEl.innerHTML = `<img src="${userData.avatar}">`;
            } else {
                avatarEl.innerText = userData.username.charAt(0).toUpperCase();
            }
        }

        function openModal(id) {
            const modal = document.getElementById(id);
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeModal(event, id) {
            if (event && event.target !== document.getElementById(id)) return;
            const modal = document.getElementById(id);
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        // Security Lock Logic
        const isLocked = localStorage.getItem('voxa_lock') === 'true';
        if (isLocked) {
            const lock = document.getElementById('securityLock');
            lock.style.display = 'flex';
            setTimeout(() => lock.classList.add('active'), 10);
            document.getElementById('unlockBtn').onclick = async () => {
                if (window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()) {
                    try {
                        const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
                        lock.classList.remove('active'); setTimeout(() => lock.style.display = 'none', 300);
                    } catch (err) { alert('Failed'); }
                } else {
                    lock.classList.remove('active'); setTimeout(() => lock.style.display = 'none', 300);
                }
            };
        }

        const savedTheme = JSON.parse(localStorage.getItem('voxa_theme'));
        if (savedTheme) document.documentElement.style.setProperty('--primary', savedTheme.primary);
    </script>
</body>
</html>
