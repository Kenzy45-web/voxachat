<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxa | Server Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00e5ff;
            --bg-color: #0b0d17;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(0, 229, 255, 0.2);
            --text-secondary: #a0a5b5;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: url('bg-logo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Faded Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(11, 13, 23, 0.95) 0%, rgba(11, 13, 23, 0.8) 100%);
            backdrop-filter: blur(10px);
            z-index: 1;
        }

        .portal-container {
            position: relative;
            z-index: 10;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 20px;
        }

        .voxa-logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-5px);
        }

        .page-title {
            margin-bottom: 40px;
        }

        .page-title h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0;
            letter-spacing: 1px;
        }

        .page-title p {
            color: var(--text-secondary);
            margin-top: 10px;
            font-size: 16px;
        }

        /* EMPTY GRID READY FOR GAMES */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            min-height: 400px;
            border: 2px dashed rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.01);
            position: relative;
        }

        .placeholder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255, 255, 255, 0.1);
        }

        .placeholder-text h2 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin: 0;
        }

        .placeholder-text p {
            font-size: 14px;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .page-title h1 { font-size: 28px; }
            .game-grid { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    
    <div class="portal-container">
        <header>
            <div class="voxa-logo">Voxa Server</div>
            <a href="dashboard.html" class="back-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Return to Dashboard
            </a>
        </header>

        <div class="page-title">
            <h1>Server Portal</h1>
            <p>Active clusters and global game hubs.</p>
        </div>

        <div class="game-grid">
            <div class="placeholder-text">
                <h2>Portal Ready</h2>
                <p>Awaiting game data and cluster configuration...</p>
            </div>
        </div>
    </div>
</body>
</html>
