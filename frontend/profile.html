<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxa | Operator Station</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00e5ff;
            --secondary-color: #7000ff;
            --bg-color: #0b0d17;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-secondary: #a0a5b5;
            --border-glow: rgba(0, 229, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        *::-webkit-scrollbar {
            display: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: url('bg-logo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(11, 13, 23, 0.95) 0%, rgba(11, 13, 23, 0.8) 100%);
            backdrop-filter: blur(5px);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            padding: 40px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .back-btn {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-color);
            cursor: pointer;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(0, 229, 255, 0.1);
            transform: translateX(-5px);
        }

        h1 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            font-weight: 800;
        }

        /* Profile Header */
        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .avatar-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            position: relative;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #1a1c29;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: 800;
            color: var(--primary-color);
            overflow: hidden;
            object-fit: cover;
        }

        .rank-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: var(--primary-color);
            color: #0b0d17;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .username {
            font-size: 28px;
            font-weight: 800;
            margin: 10px 0 5px;
            letter-spacing: 1px;
        }

        .email {
            color: var(--text-secondary);
            font-size: 15px;
            opacity: 0.8;
        }

        /* Settings List */
        .settings-group {
            margin-bottom: 35px;
        }

        .group-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--primary-color);
            margin-bottom: 20px;
            padding-left: 10px;
            font-weight: 600;
            opacity: 0.7;
        }

        .setting-item {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .setting-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--border-glow);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .setting-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .setting-icon {
            width: 44px;
            height: 44px;
            background: rgba(0, 229, 255, 0.07);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-color);
            border: 1px solid rgba(0, 229, 255, 0.1);
        }

        .setting-details {
            display: flex;
            flex-direction: column;
        }

        .setting-label {
            font-weight: 600;
            font-size: 16px;
        }

        .setting-value {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .chevron {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .btn-logout {
            width: 100%;
            padding: 20px;
            background: rgba(255, 51, 102, 0.05);
            border: 1px solid rgba(255, 51, 102, 0.2);
            border-radius: 20px;
            color: #ff3366;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
            margin-bottom: 50px;
        }

        .btn-logout:hover {
            background: rgba(255, 51, 102, 0.15);
            border-color: #ff3366;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.2);
        }

    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="container">
        <header>
            <div class="back-btn" onclick="window.location.href='dashboard.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </div>
            <h1>Operator Station</h1>
        </header>

        <div class="profile-card">
            <div class="avatar-container">
                <div class="avatar-img" id="userAvatar">?</div>
                <div class="rank-badge" id="userRank">#1</div>
            </div>
            <div class="username" id="userName">Loading...</div>
            <div class="email" id="userEmail">accessing database...</div>
        </div>

        <div class="settings-group">
            <div class="group-label">Network Identity</div>
            <div class="setting-item">
                <div class="setting-info">
                    <div class="setting-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                    <div class="setting-details">
                        <div class="setting-label">Username</div>
                        <div class="setting-value" id="valUsername">...</div>
                    </div>
                </div>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <div class="setting-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    </div>
                    <div class="setting-details">
                        <div class="setting-label">Network Email</div>
                        <div class="setting-value" id="valEmail">...</div>
                    </div>
                </div>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <div class="setting-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    </div>
                    <div class="setting-details">
                        <div class="setting-label">Server Ranking</div>
                        <div class="setting-value" id="valRank">#1</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings-group">
            <div class="group-label">Security Protocol</div>
            <div class="setting-item">
                <div class="setting-info">
                    <div class="setting-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 21 17 13 7 13 7 21"></polyline><path d="M6 7V4a4 4 0 0 1 8 0v3"></path></svg>
                    </div>
                    <div class="setting-label">Gaming UIDs</div>
                </div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <div class="setting-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                    <div class="setting-label">Password & Keys</div>
                </div>
                <div class="chevron">›</div>
            </div>
        </div>

        <div class="settings-group">
            <div class="group-label">Alerts</div>
            <div class="setting-item">
                <div class="setting-info">
                    <div class="setting-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    </div>
                    <div class="setting-label">Notifications</div>
                </div>
                <div class="chevron">›</div>
            </div>
        </div>

        <button class="btn-logout" id="logoutBtn">TERMINATE SESSION</button>
    </div>

    <script>
        // Load User Data
        const userData = JSON.parse(localStorage.getItem('voxa_user'));
        
        if (!userData) {
            window.location.href = 'login.html';
        } else {
            // Update Header Card
            document.getElementById('userName').innerText = userData.username;
            document.getElementById('userEmail').innerText = userData.email;
            document.getElementById('userRank').innerText = `#${userData.rank}`;
            
            // Update Identity Section
            document.getElementById('valUsername').innerText = userData.username;
            document.getElementById('valEmail').innerText = userData.email;
            document.getElementById('valRank').innerText = `#${userData.rank}`;
            
            const avatarEl = document.getElementById('userAvatar');
            if (userData.avatar && userData.avatar.startsWith('data:image')) {
                avatarEl.innerHTML = `<img src="${userData.avatar}" style="width:100%; height:100%; object-fit:cover;">`;
            } else {
                avatarEl.innerText = userData.username.charAt(0).toUpperCase();
            }
        }

        // Logout logic
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('voxa_token');
            localStorage.removeItem('voxa_user');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
