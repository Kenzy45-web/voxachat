<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxa | Operator Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00e5ff;
            --secondary-color: #7000ff;
            --bg-color: #0b0d17;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-secondary: #a0a5b5;
            --border-glow: rgba(0, 229, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        *::-webkit-scrollbar {
            display: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: url('bg-logo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(11, 13, 23, 0.95) 0%, rgba(11, 13, 23, 0.8) 100%);
            backdrop-filter: blur(5px);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            padding: 40px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .back-btn {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-color);
            cursor: pointer;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(0, 229, 255, 0.1);
            transform: translateX(-5px);
        }

        h1 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        /* Profile Header */
        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            position: relative;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #1a1c29;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: 800;
            color: var(--primary-color);
            overflow: hidden;
            object-fit: cover;
        }

        .rank-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary-color);
            color: #0b0d17;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
        }

        .username {
            font-size: 24px;
            font-weight: 800;
            margin: 10px 0 5px;
        }

        .email {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Settings List */
        .settings-group {
            margin-bottom: 30px;
        }

        .group-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            padding-left: 10px;
        }

        .setting-item {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 18px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .setting-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--border-glow);
        }

        .setting-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .setting-icon {
            width: 40px;
            height: 40px;
            background: rgba(0, 229, 255, 0.05);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-color);
        }

        .setting-label {
            font-weight: 500;
        }

        .chevron {
            color: var(--text-secondary);
        }

        .btn-logout {
            width: 100%;
            padding: 18px;
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.2);
            border-radius: 16px;
            color: #ff3366;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-logout:hover {
            background: rgba(255, 51, 102, 0.2);
        }

    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="container">
        <header>
            <div class="back-btn" onclick="window.location.href='dashboard.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </div>
            <h1>Operator Profile</h1>
        </header>

        <div class="profile-card">
            <div class="avatar-container">
                <div class="avatar-img" id="userAvatar">?</div>
                <div class="rank-badge" id="userRank">#1</div>
            </div>
            <div class="username" id="userName">Loading...</div>
            <div class="email" id="userEmail">accessing database...</div>
        </div>

        <div class="settings-group">
            <div class="group-label">Security Protocol</div>
            <div class="setting-item">
                <div class="setting-info">
                    <div class="setting-icon">🛡️</div>
                    <div class="setting-label">Gaming UIDs</div>
                </div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <div class="setting-icon">🔐</div>
                    <div class="setting-label">Password & Keys</div>
                </div>
                <div class="chevron">›</div>
            </div>
        </div>

        <div class="settings-group">
            <div class="group-label">Communication</div>
            <div class="setting-item">
                <div class="setting-info">
                    <div class="setting-icon">🔔</div>
                    <div class="setting-label">Notifications</div>
                </div>
                <div class="chevron">›</div>
            </div>
        </div>

        <button class="btn-logout" id="logoutBtn">TERMINATE SESSION</button>
    </div>

    <script>
        // Load User Data
        const userData = JSON.parse(localStorage.getItem('voxa_user'));
        
        if (!userData) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('userName').innerText = userData.username;
            document.getElementById('userEmail').innerText = userData.email;
            document.getElementById('userRank').innerText = `#${userData.rank}`;
            
            const avatarEl = document.getElementById('userAvatar');
            if (userData.avatar && userData.avatar.startsWith('data:image')) {
                avatarEl.innerHTML = `<img src="${userData.avatar}" style="width:100%; height:100%; object-fit:cover;">`;
            } else {
                avatarEl.innerText = userData.username.charAt(0).toUpperCase();
            }
        }

        // Logout logic
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('voxa_token');
            localStorage.removeItem('voxa_user');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
