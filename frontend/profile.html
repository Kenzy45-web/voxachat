<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxa | Operator Station</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <style id="themeStyles">
        :root {
            --primary-color: #00e5ff;
            --secondary-color: #7000ff;
            --bg-color: #0b0d17;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-secondary: #a0a5b5;
            --border-glow: rgba(0, 229, 255, 0.2);
        }
    </style>
    <style>
        * {
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-tap-highlight-color: transparent;
        }

        *::-webkit-scrollbar {
            display: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: url('bg-logo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            color: white;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(11, 13, 23, 0.95) 0%, rgba(11, 13, 23, 0.8) 100%);
            backdrop-filter: blur(5px);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            padding: 40px 15px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-color);
            cursor: pointer;
        }

        h1 {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            font-weight: 800;
        }

        /* Profile Header */
        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 28px;
            padding: 35px 20px;
            text-align: center;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
        }

        .avatar-container {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            overflow: hidden;
            cursor: pointer; /* Click to view full */
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #1a1c29;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: 800;
            color: var(--primary-color);
            overflow: hidden;
            object-fit: cover;
        }

        .add-avatar-btn {
            position: absolute;
            bottom: 0;
            right: -5px;
            width: 32px;
            height: 32px;
            background: var(--primary-color);
            color: #0b0d17;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 3px solid #0b0d17;
            font-size: 18px;
            font-weight: 800;
        }

        .username-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .username {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 0;
        }

        .copy-btn {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.2);
            color: var(--primary-color);
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
        }

        .copy-btn:active { transform: scale(0.9); }

        .rank-text {
            color: var(--primary-color);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        /* Settings List */
        .settings-group {
            margin-bottom: 30px;
        }

        .group-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--primary-color);
            margin-bottom: 15px;
            padding-left: 5px;
            font-weight: 600;
            opacity: 0.6;
        }

        .setting-item {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .setting-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .setting-icon {
            width: 40px;
            height: 40px;
            background: rgba(0, 229, 255, 0.05);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-color);
            border: 1px solid rgba(0, 229, 255, 0.1);
        }

        .setting-details {
            display: flex;
            flex-direction: column;
        }

        .setting-label {
            font-weight: 600;
            font-size: 15px;
        }

        .setting-value {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .appearance-grid {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 5px;
        }

        .theme-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .theme-circle.active {
            border-color: white;
            box-shadow: 0 0 10px var(--primary-color);
            transform: scale(1.1);
        }

        .add-theme-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: 800;
        }

        .action-btn {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.3);
            color: var(--primary-color);
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Color Machine UI */
        .color-machine {
            display: none;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-glow);
            border-radius: 15px;
            padding: 15px;
            margin-top: 15px;
            width: 100%;
        }

        .color-machine.active { display: block; }

        .ai-gen-row { display: flex; gap: 10px; width: 100%; margin-bottom: 10px; }

        .hex-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            padding: 10px;
            color: white;
            font-family: 'Inter', monospace;
            flex-grow: 1;
            font-size: 14px;
            text-align: center;
        }

        .apply-machine-btn {
            background: var(--primary-color);
            color: #0b0d17;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
            letter-spacing: 1px;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            width: 90%;
            max-width: 350px;
        }

        .toast {
            background: rgba(11, 13, 23, 0.9);
            border: 1px solid var(--primary-color);
            backdrop-filter: blur(15px);
            padding: 15px 20px;
            border-radius: 16px;
            color: white;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-top: 10px;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .btn-logout {
            width: 100%;
            padding: 20px;
            background: rgba(255, 51, 102, 0.05);
            border: 1px solid rgba(255, 51, 102, 0.2);
            border-radius: 20px;
            color: #ff3366;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            margin-bottom: 50px;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: #111420;
            border: 1px solid var(--border-glow);
            border-radius: 30px;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            position: relative;
        }

        .full-view-img {
            width: 100%;
            border-radius: 20px;
            border: 2px solid var(--primary-color);
        }

    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="container">
        <header>
            <div class="back-btn" onclick="window.location.href='dashboard.html'">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </div>
            <h1>Operator Profile</h1>
        </header>

        <div class="profile-card">
            <div class="avatar-wrapper">
                <div class="avatar-container" id="viewFullAvatar">
                    <div class="avatar-img" id="userAvatar">?</div>
                </div>
                <div class="add-avatar-btn" id="addAvatarBtn">+</div>
            </div>
            <div class="username-row">
                <h2 class="username" id="userName">...</h2>
                <div class="copy-btn" id="copyUsername">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </div>
            </div>
            <div id="headerEmail" style="font-size: 14px; color: var(--text-secondary); margin-top: 5px; opacity: 0.8;">...</div>
            <div class="rank-text" id="userRankText">#...</div>
        </div>

        <div class="settings-group">
            <div class="group-label">Appearance Hub</div>
            <div class="setting-item" style="flex-direction: column; align-items: flex-start;">
                <div class="setting-info">
                    <div class="setting-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    </div>
                    <div class="setting-label">Theme Color</div>
                </div>
                <div class="appearance-grid">
                    <div class="theme-circle" style="background: #00e5ff;" onclick="setTheme('#00e5ff', '#7000ff')"></div>
                    <div class="theme-circle" style="background: #ff3366;" onclick="setTheme('#ff3366', '#ff00ff')"></div>
                    <div class="theme-circle" style="background: #00ff88;" onclick="setTheme('#00ff88', '#0099ff')"></div>
                    <div class="theme-circle" style="background: #7000ff;" onclick="setTheme('#7000ff', '#00e5ff')"></div>
                    <div class="add-theme-btn" id="openMachineBtn">+</div>
                </div>

                <div class="color-machine" id="colorMachine">
                    <div class="ai-gen-row">
                        <input type="text" id="machineHex" class="hex-input" placeholder="#00E5FF">
                        <button class="action-btn" id="aiGenBtn">GENERATE AI</button>
                    </div>
                    <button class="apply-machine-btn" id="applyMachineBtn">APPLY PROTOCOL</button>
                </div>
            </div>
        </div>

        <div class="settings-group">
            <div class="group-label">Alert Protocols</div>
            <div class="setting-item">
                <div class="setting-info">
                    <div class="setting-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    </div>
                    <div class="setting-details">
                        <div class="setting-label">Notifications</div>
                        <div class="setting-value" id="notifStatus">Audio alerts active</div>
                    </div>
                </div>
                <button class="action-btn" id="notifBtn">ARM ALERTS</button>
            </div>
        </div>

        <button class="btn-logout" onclick="window.location.href='login.html'">LOGOUT</button>
    </div>

    <!-- Modals -->
    <div class="modal" id="avatarModal">
        <div class="modal-content">
            <h2 style="text-align: center; color: var(--primary-color);">SELECT CHARACTER</h2>
            <div class="char-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0;">
                <div class="char-option" onclick="updateAvatar('https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Operator1&backgroundColor=0b0d17')"><img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Operator1&backgroundColor=0b0d17"></div>
                <div class="char-option" onclick="updateAvatar('https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Ghost&backgroundColor=0b0d17')"><img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Ghost&backgroundColor=0b0d17"></div>
                <div class="char-option" onclick="updateAvatar('https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Shadow&backgroundColor=0b0d17')"><img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Shadow&backgroundColor=0b0d17"></div>
                <div class="char-option" onclick="updateAvatar('https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Titan&backgroundColor=0b0d17')"><img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Titan&backgroundColor=0b0d17"></div>
                <div class="char-option" onclick="updateAvatar('https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Alpha&backgroundColor=0b0d17')"><img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Alpha&backgroundColor=0b0d17"></div>
                <div class="char-option" onclick="updateAvatar('https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Raven&backgroundColor=0b0d17')"><img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Raven&backgroundColor=0b0d17"></div>
            </div>
            <div class="upload-btn" onclick="document.getElementById('fileInput').click()">UPLOAD FROM GALLERY</div>
            <input type="file" id="fileInput" hidden accept="image/*">
            <div style="text-align: center; margin-top: 15px; color: var(--text-secondary); cursor: pointer;" onclick="document.getElementById('avatarModal').classList.remove('active')">CANCEL</div>
        </div>
    </div>

    <!-- Full Avatar Modal -->
    <div class="modal" id="fullAvatarModal">
        <div class="modal-content" style="background: transparent; border: none; text-align: center;">
            <img id="fullAvatarImg" class="full-view-img" src="">
            <button class="action-btn" style="margin-top: 20px;" onclick="document.getElementById('fullAvatarModal').classList.remove('active')">CLOSE PROTOCOL</button>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const userData = JSON.parse(localStorage.getItem('voxa_user'));
        const botSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3');

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> ${msg}`;
            container.appendChild(toast);
            botSound.play().catch(() => {});
            setTimeout(() => toast.remove(), 3000);
        }

        function refreshUI() {
            if (!userData) { window.location.href = 'login.html'; return; }
            document.getElementById('userName').innerText = userData.username;
            document.getElementById('userRankText').innerText = `#${userData.rank}`;
            document.getElementById('headerEmail').innerText = userData.email;
            
            const avatarEl = document.getElementById('userAvatar');
            const avatarSrc = userData.avatar && (userData.avatar.startsWith('data:image') || userData.avatar.startsWith('http')) ? userData.avatar : null;
            
            if (avatarSrc) {
                avatarEl.innerHTML = `<img src="${avatarSrc}" style="width:100%; height:100%; object-fit:cover;">`;
            } else {
                avatarEl.innerText = userData.username.charAt(0).toUpperCase();
            }
        }
        refreshUI();

        // Full Avatar View
        document.getElementById('viewFullAvatar').onclick = () => {
            const avatarImg = document.getElementById('userAvatar').querySelector('img');
            if (avatarImg) {
                document.getElementById('fullAvatarImg').src = avatarImg.src;
                document.getElementById('fullAvatarModal').classList.add('active');
            }
        };

        // Copy Username
        document.getElementById('copyUsername').onclick = () => {
            const tempInput = document.createElement('input');
            tempInput.value = userData.username;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast('Copied');
        };

        // Avatar Update
        document.getElementById('addAvatarBtn').onclick = () => document.getElementById('avatarModal').classList.add('active');
        function updateAvatar(newUrl) {
            userData.avatar = newUrl;
            localStorage.setItem('voxa_user', JSON.stringify(userData));
            document.getElementById('avatarModal').classList.remove('active');
            refreshUI();
            showToast('Avatar Synced');
        }

        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => updateAvatar(event.target.result);
                reader.readAsDataURL(file);
            }
        };

        // AI Color
        document.getElementById('openMachineBtn').onclick = () => document.getElementById('colorMachine').classList.toggle('active');
        document.getElementById('aiGenBtn').onclick = () => {
            const colors = ['#00E5FF', '#FF3366', '#00FF88', '#7000FF', '#FFA500', '#FFD700', '#FF00FF', '#00FFFF'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.getElementById('machineHex').value = randomColor;
            showToast('AI Color Generated');
        };
        document.getElementById('applyMachineBtn').onclick = () => {
            const color = document.getElementById('machineHex').value || '#00E5FF';
            setTheme(color, color);
            showToast('Theme Applied');
        };

        function setTheme(primary, secondary) {
            document.documentElement.style.setProperty('--primary-color', primary);
            document.documentElement.style.setProperty('--secondary-color', secondary);
            localStorage.setItem('voxa_theme', JSON.stringify({primary, secondary}));
        }

        const savedTheme = JSON.parse(localStorage.getItem('voxa_theme'));
        if (savedTheme) setTheme(savedTheme.primary, savedTheme.secondary);

        // Notifications
        const notifBtn = document.getElementById('notifBtn');
        const notifStatus = document.getElementById('notifStatus');
        let armed = true;
        notifBtn.onclick = () => {
            armed = !armed;
            notifBtn.innerText = armed ? 'ARM ALERTS' : 'DISARM ALERTS';
            notifStatus.innerText = armed ? 'Audio alerts active' : 'Audio alerts offline';
            showToast(armed ? 'Alerts Armed' : 'Alerts Offline');
        };
    </script>
</body>
</html>
