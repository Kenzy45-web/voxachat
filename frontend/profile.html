<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxa | Operator Station</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <style id="themeStyles">
        :root {
            --primary-color: #00e5ff;
            --secondary-color: #7000ff;
            --bg-color: #0b0d17;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-secondary: #a0a5b5;
            --border-glow: rgba(0, 229, 255, 0.2);
        }
    </style>
    <style>
        * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; -webkit-tap-highlight-color: transparent; }
        *::-webkit-scrollbar { display: none; }

        body {
            margin: 0; padding: 0; background-color: var(--bg-color);
            background-image: url('bg-logo.png'); background-size: cover; background-position: center; background-attachment: fixed;
            font-family: 'Inter', sans-serif; color: white; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column;
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(11, 13, 23, 0.95) 0%, rgba(11, 13, 23, 0.8) 100%); backdrop-filter: blur(5px); z-index: 1; }
        .container { position: relative; z-index: 10; padding: 40px 15px; width: 100%; max-width: 500px; margin: 0 auto; }

        header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .back-btn { width: 40px; height: 40px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glow); border-radius: 12px; display: flex; justify-content: center; align-items: center; color: var(--primary-color); cursor: pointer; }
        h1 { font-size: 20px; text-transform: uppercase; letter-spacing: 2px; margin: 0; font-weight: 800; }

        .profile-card { background: var(--card-bg); border: 1px solid var(--border-glow); border-radius: 28px; padding: 35px 20px; text-align: center; margin-bottom: 30px; backdrop-filter: blur(10px); }
        .avatar-wrapper { position: relative; width: 110px; height: 110px; margin: 0 auto 15px; }
        .avatar-container { width: 100%; height: 100%; border-radius: 50%; padding: 3px; background: linear-gradient(45deg, var(--primary-color), var(--secondary-color)); box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); overflow: hidden; cursor: pointer; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; background: #1a1c29; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: 800; color: var(--primary-color); overflow: hidden; object-fit: cover; }
        .add-avatar-btn { position: absolute; bottom: 0; right: -5px; width: 32px; height: 32px; background: var(--primary-color); color: #0b0d17; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 3px solid #0b0d17; font-size: 18px; font-weight: 800; }

        .username-row { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }
        .username { font-size: 26px; font-weight: 800; letter-spacing: 1px; margin: 0; }
        .copy-btn { background: rgba(0, 229, 255, 0.1); border: 1px solid rgba(0, 229, 255, 0.2); color: var(--primary-color); padding: 6px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .copy-btn:active { transform: scale(0.9); }
        .rank-text { color: var(--primary-color); font-size: 14px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-top: 8px; }

        .settings-group { margin-bottom: 30px; }
        .group-label { font-size: 12px; text-transform: uppercase; letter-spacing: 3px; color: var(--primary-color); margin-bottom: 15px; padding-left: 5px; font-weight: 600; opacity: 0.6; }
        .setting-item { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05); padding: 18px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .setting-info { display: flex; align-items: center; gap: 15px; }
        .setting-icon { width: 40px; height: 40px; background: rgba(0, 229, 255, 0.05); border-radius: 10px; display: flex; justify-content: center; align-items: center; color: var(--primary-color); border: 1px solid rgba(0, 229, 255, 0.1); }
        .setting-label { font-weight: 600; font-size: 15px; }
        .setting-value { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

        .action-btn { background: rgba(0, 229, 255, 0.1); border: 1px solid rgba(0, 229, 255, 0.3); color: var(--primary-color); padding: 8px 15px; border-radius: 10px; font-weight: 800; font-size: 11px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }

        .color-machine { display: none; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-glow); border-radius: 15px; padding: 15px; margin-top: 15px; width: 100%; }
        .color-machine.active { display: block; }
        .ai-gen-row { display: flex; gap: 10px; width: 100%; margin-bottom: 10px; }
        .hex-input { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glow); border-radius: 10px; padding: 10px; color: white; font-family: 'Inter', monospace; flex-grow: 1; font-size: 14px; text-align: center; }
        .apply-btn { background: var(--primary-color); color: #0b0d17; border: none; border-radius: 10px; padding: 12px; font-weight: 800; cursor: pointer; font-size: 12px; width: 100%; letter-spacing: 1px; }

        .toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 2000; width: 90%; max-width: 350px; }
        .toast { background: rgba(11, 13, 23, 0.9); border: 1px solid var(--primary-color); backdrop-filter: blur(15px); padding: 15px 20px; border-radius: 16px; color: white; font-weight: 600; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); margin-top: 10px; animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .btn-logout { width: 100%; padding: 20px; background: rgba(255, 51, 102, 0.05); border: 1px solid rgba(255, 51, 102, 0.2); border-radius: 20px; color: #ff3366; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; margin-bottom: 50px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); justify-content: center; align-items: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: #111420; border: 1px solid var(--border-glow); border-radius: 30px; width: 100%; max-width: 400px; padding: 25px; position: relative; }
        .full-view-img { width: 100%; border-radius: 20px; border: 2px solid var(--primary-color); }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="container">
        <header>
            <div class="back-btn" onclick="window.location.href='dashboard.html'">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </div>
            <h1>Operator Profile</h1>
        </header>

        <div class="profile-card">
            <div class="avatar-wrapper">
                <div class="avatar-container" id="viewFullAvatar">
                    <div class="avatar-img" id="userAvatar">?</div>
                </div>
                <div class="add-avatar-btn" id="addAvatarBtn">+</div>
            </div>
            <div class="username-row">
                <h2 class="username" id="userName">...</h2>
                <div class="copy-btn" id="copyUsername">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </div>
            </div>
            <div id="headerEmail" style="font-size: 14px; color: var(--text-secondary); margin-top: 5px; opacity: 0.8;">...</div>
            <div class="rank-text" id="userRankText">#...</div>
        </div>

        <div class="settings-group">
            <div class="group-label">Appearance Hub</div>
            <div class="setting-item" style="flex-direction: column; align-items: flex-start;">
                <div class="setting-info"><div class="setting-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></div><div class="setting-label">Interface Theme</div></div>
                <div class="appearance-grid" style="display: flex; gap: 10px; margin-top: 15px;">
                    <div class="theme-circle" style="background: #00e5ff;" onclick="setTheme('#00e5ff')"></div>
                    <div class="theme-circle" style="background: #ff3366;" onclick="setTheme('#ff3366')"></div>
                    <div class="theme-circle" style="background: #00ff88;" onclick="setTheme('#00ff88')"></div>
                    <div class="theme-circle" style="background: #7000ff;" onclick="setTheme('#7000ff')"></div>
                    <div class="add-theme-btn" onclick="document.getElementById('colorMachine').classList.toggle('active')">+</div>
                </div>
                <div class="color-machine" id="colorMachine">
                    <div class="ai-gen-row"><input type="text" id="machineHex" class="hex-input" placeholder="#00E5FF"><button class="action-btn" onclick="genAIC()">GEN AI</button></div>
                    <button class="apply-btn" onclick="applyCustom()">APPLY PROTOCOL</button>
                </div>
            </div>
        </div>

        <div class="settings-group">
            <div class="group-label">Network Identity</div>
            <div class="setting-item">
                <div class="setting-info"><div class="setting-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg></div><div class="setting-details"><div class="setting-label">Email Address</div><div class="setting-value" id="valEmail">...</div></div></div>
            </div>
        </div>

        <button class="btn-logout" onclick="window.location.href='login.html'">LOGOUT</button>
    </div>

    <!-- Modals -->
    <div class="modal" id="avatarModal"><div class="modal-content"><h2 style="text-align: center; color: var(--primary-color);">SELECT CHARACTER</h2><div id="charGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0;"></div><div class="action-btn" style="width: 100%; text-align: center; padding: 15px;" onclick="document.getElementById('fileInput').click()">UPLOAD FROM GALLERY</div><input type="file" id="fileInput" hidden accept="image/*"><div style="text-align: center; margin-top: 15px; color: var(--text-secondary); cursor: pointer;" onclick="document.getElementById('avatarModal').classList.remove('active')">CANCEL</div></div></div>
    <div class="modal" id="fullAvatarModal"><div class="modal-content" style="background: transparent; border: none; text-align: center;"><img id="fullAvatarImg" class="full-view-img" src=""><button class="action-btn" style="margin-top: 20px;" onclick="document.getElementById('fullAvatarModal').classList.remove('active')">CLOSE</button></div></div>
    <div class="toast-container" id="toastContainer"></div>

    <script>
        const userData = JSON.parse(localStorage.getItem('voxa_user'));
        const botSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3');

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> ${msg}`;
            container.appendChild(toast);
            botSound.play().catch(() => {});
            setTimeout(() => toast.remove(), 3000);
        }

        function refreshUI() {
            if (!userData) { window.location.href = 'login.html'; return; }
            document.getElementById('userName').innerText = userData.username;
            document.getElementById('userRankText').innerText = `#${userData.rank}`;
            document.getElementById('headerEmail').innerText = userData.email;
            document.getElementById('valEmail').innerText = userData.email;
            const avatarEl = document.getElementById('userAvatar');
            if (userData.avatar) { avatarEl.innerHTML = `<img src="${userData.avatar}" style="width:100%; height:100%; object-fit:cover;">`; }
            else { avatarEl.innerText = userData.username.charAt(0).toUpperCase(); }
        }
        refreshUI();

        document.getElementById('viewFullAvatar').onclick = () => {
            const img = document.getElementById('userAvatar').querySelector('img');
            if (img) { document.getElementById('fullAvatarImg').src = img.src; document.getElementById('fullAvatarModal').classList.add('active'); }
        };

        document.getElementById('copyUsername').onclick = () => {
            navigator.clipboard.writeText(userData.username);
            showToast('Copied');
        };

        document.getElementById('addAvatarBtn').onclick = () => {
            const grid = document.getElementById('charGrid');
            grid.innerHTML = '';
            ['Operator1', 'Ghost', 'Shadow', 'Titan', 'Alpha', 'Raven'].forEach(s => {
                const div = document.createElement('div');
                const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${s}&backgroundColor=0b0d17`;
                div.innerHTML = `<img src="${url}" style="width:100%; border-radius:10px; cursor:pointer;">`;
                div.onclick = () => { userData.avatar = url; localStorage.setItem('voxa_user', JSON.stringify(userData)); refreshUI(); document.getElementById('avatarModal').classList.remove('active'); showToast('Avatar Updated'); };
                grid.appendChild(div);
            });
            document.getElementById('avatarModal').classList.add('active');
        };

        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => { userData.avatar = event.target.result; localStorage.setItem('voxa_user', JSON.stringify(userData)); refreshUI(); document.getElementById('avatarModal').classList.remove('active'); showToast('Avatar Updated'); };
                reader.readAsDataURL(file);
            }
        };

        function setTheme(c) {
            document.documentElement.style.setProperty('--primary-color', c);
            localStorage.setItem('voxa_theme', JSON.stringify({primary: c, secondary: c}));
            showToast('Theme Updated');
        }

        function genAIC() {
            const c = ['#00E5FF', '#FF3366', '#00FF88', '#7000FF', '#FFA500'][Math.floor(Math.random()*5)];
            document.getElementById('machineHex').value = c;
            showToast('AI Color Generated');
        }

        function applyCustom() {
            const c = document.getElementById('machineHex').value || '#00E5FF';
            setTheme(c);
        }

        const savedTheme = JSON.parse(localStorage.getItem('voxa_theme'));
        if (savedTheme) { document.documentElement.style.setProperty('--primary-color', savedTheme.primary); }
    </script>
</body>
</html>
